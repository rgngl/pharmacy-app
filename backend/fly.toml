# fly.toml app configuration file generated for pharmacy-app on 2026-11-21T23:57:57+02:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pharmacy-app'
primary_region = 'arn'
kill_signal = 'SIGTERM'

[build]
[env]
  PHX_HOST = 'pharmacy-app.fly.dev'
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpus = 1
